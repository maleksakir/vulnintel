name: CI

# Runs on every PR and on every push to main. deploy.yml's staging job waits
# for *this* workflow (by name) to report success via a workflow_run trigger,
# so keep the name "CI" in sync with deploy.yml if it ever changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Cheap, repo-wide path classification so the (comparatively expensive)
  # vitest-plugin jobs below skip the app that clearly can't be affected.
  # Intentionally not more granular than this for a 3-package repo.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ingest: ${{ steps.filter.outputs.ingest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'packages/contracts/**'
              - 'migrations/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            ingest:
              - 'apps/ingest/**'
              - 'packages/contracts/**'
              - 'migrations/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'

  # Biome is being rolled out in a parallel workstream (see
  # docs/EXECUTION_PLAN.md, Phase 1). Skip gracefully until biome.json lands
  # instead of failing CI on a config file that doesn't exist yet.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        run: pnpm install --frozen-lockfile
      - name: Biome check
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        run: pnpm exec biome ci .
      - name: Skip — no Biome config yet
        if: hashFiles('biome.json', 'biome.jsonc') == ''
        run: echo "No biome.json/biome.jsonc at repo root yet — skipping lint (see docs/EXECUTION_PLAN.md Phase 1)."

  # Whole-repo typecheck, always run (not path-filtered): packages/contracts
  # is shared by both apps, and svelte-check/tsc are cheap enough at this
  # repo's size that filtering them isn't worth the added complexity.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r check

  test-app:
    name: Test (apps/app)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run vitest (apps/app, real D1/KV via workerd)
        run: pnpm --filter=threat-lens-app test

  test-ingest:
    name: Test (apps/ingest)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run vitest (apps/ingest, real D1/KV/Queues via workerd)
        run: pnpm --filter=@threat-lens/ingest test
