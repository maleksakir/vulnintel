name: Deploy

# Triggers only on a push to main in THIS repo — never on pull_request, so a
# fork PR can never reach a job holding CLOUDFLARE_API_TOKEN. CI is gated via
# `needs: ci` calling ci.yml as a reusable workflow (workflow_call) in the
# SAME run, not via workflow_run against a separate run — workflow_run's
# `branches: [main]` filter matches the triggering run's head_branch, which
# for a fork PR is attacker-controlled, and would otherwise let a crafted
# "CI" run on a branch named `main` in a fork trigger a real deploy here.
# (Ship-blocking finding from the 2026-10-28 review — see git history.)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: CI (gate)
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to staging
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Separate GitHub Environment from production so this job's token can be
    # scoped independently (narrower Cloudflare API token permissions) once
    # one is provisioned — today it points at the same secret as production
    # until a second, more narrowly-scoped token exists. Create this
    # Environment in repo Settings before the first deploy.
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # This job holds CLOUDFLARE_API_TOKEN from here on — skip install
      # scripts so a compromised/malicious transitive dependency can't run
      # arbitrary code in a token-bearing job (npm/pnpm postinstall hooks).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # apps/ingest has no build step — wrangler bundles src/index.ts
      # directly at deploy time. apps/app needs its SvelteKit build output
      # (.svelte-kit/cloudflare/_worker.js) to exist first; wrangler.toml
      # points straight at that generated file.
      - name: Build apps/app
        run: pnpm --filter=threat-lens-app build

      - name: Deploy apps/ingest to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/ingest
          command: deploy --env staging

      - name: Deploy apps/app to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/app
          command: deploy --env staging

  # Gated behind the GitHub Environment "production" (required reviewers
  # configured on that Environment in repo Settings → Environments — not
  # created by this workflow; GitHub auto-creates an unprotected Environment
  # on first use, so this MUST be configured before the first push to main).
  deploy-production:
    name: Deploy to production (manual approval)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build apps/app
        run: pnpm --filter=threat-lens-app build

      - name: Deploy apps/ingest to production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/ingest
          command: deploy

      - name: Deploy apps/app to production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/app
          command: deploy
