name = "threat-lens-ingest"
main = "src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

# This worker has no public routes. It is invoked solely by cron triggers
# and the retry queue. Workers.dev route is disabled in the dashboard.
workers_dev = false

# Native Workers Logs — free, searchable in the dashboard. Especially useful
# here: this is the worker that silently drifted its cron schedule and blew
# the KV quota with no alerting in place before today.
[observability]
enabled = true

# NOTE: tried declaring [limits] cpu_ms here to give the aging sweep more
# headroom — rejected at deploy time: "CPU limits are not supported for the
# Free plan." The Free plan's CPU budget per invocation is fixed and not
# configurable; the batching in pipelines/aging.ts is the only lever
# available on this plan (keep each invocation's work small rather than
# trying to raise the ceiling). Revisit if this account ever moves to Paid.

# Cron schedule. Each cron expression dispatches to a distinct pipeline
# inside the scheduled() handler. Full dispatch table is in Section 5.1.1.
[triggers]
crons = [
  "0 1 * * *",       # 01:00 UTC daily — NVD + MITRE + EPSS full delta
  "0 */6 * * *",     # every 6 hours — CISA KEV fast lane
  "0 3 * * 7",       # 03:00 UTC Sunday — 30-day reconciliation sweep
  "30 2 * * *",      # 02:30 UTC daily — aging sweep (24-month cutoff)
  "0 4 * * *",       # 04:00 UTC daily — IP allowlist expiry prune
]

# D1/KV resource IDs are not secrets (confirmed in the 2026-10-28 security
# review) — committed directly rather than left as REPLACE_AFTER_PROVISIONING
# placeholders, which had silently broken the staging deploy job in CI.
[[d1_databases]]
binding = "DB"
database_name = "cve_prod_d1"
database_id = "277f037d-d7b2-405e-b639-6fef206f260c"
migrations_dir = "../../migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "cve-vector-index"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cve_analytics_dataset"

# Workers AI binding for ingest-time embeddings (only when text fields change).
[ai]
binding = "AI"

# Same KV namespace the app worker uses. The ingest worker holds write-only
# intent: it deletes cache keys after a record is updated so the app worker
# does not serve a stale snapshot. See Section 2.7 for the invalidation map.
[[kv_namespaces]]
binding = "CACHE"
id = "6a5b96655a224e0cabccfd3611fa57fe"

# Retry queue for failed per-record persistence. DLQ binding is in the
# producer config; the queue consumer worker subscribes separately.
[[queues.producers]]
queue = "cve-ingest-retry"
binding = "RETRY_QUEUE"

[[queues.consumers]]
queue = "cve-ingest-retry"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "cve-ingest-dlq"

# EPSS queue. FIRST.org ships a full 250k+-row daily snapshot, not a delta —
# the change-detection reads + writes for that can't fit in the single daily
# cron invocation's 50-D1-query budget (D1 free-tier limit) alongside the
# same invocation's NVD+MITRE work. pipelines/daily.ts now only
# fetches+chunks+enqueues onto this queue; pipelines/epssQueue.ts's consumer
# does the actual D1 work, one message (~1,000 patches) per invocation.
# max_batch_size = 1 keeps that one-message-per-invocation guarantee exact,
# so each consumer invocation's D1 query count stays small and predictable
# (~1,000/100 = 10 SELECT sub-chunks + a handful of batched writes —
# comfortably under 50).
[[queues.producers]]
queue = "epss-ingest"
binding = "EPSS_QUEUE"

[[queues.consumers]]
queue = "epss-ingest"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "epss-ingest-dlq"

# NVD queue. NVD's 48h delta is variable (hundreds to low-thousands of
# modified records per window, not a fixed daily snapshot like EPSS's
# 250k-row CSV) and each CHANGED record's processRecord() call costs up to
# ~5 D1 queries — far more per-record than EPSS's batched applyEpssPatchBatch
# — so even a few dozen changed records would exhaust the single daily cron
# invocation's 50-D1-query budget alongside NVD+MITRE+EPSS's other work.
# pipelines/daily.ts now only fetches+size-aware-batches+enqueues onto this
# queue; pipelines/nvdQueue.ts's consumer does the actual processRecord()
# work, one small bounded batch (see NVD_QUEUE_MAX_RECORDS/NVD_QUEUE_MAX_BYTES
# in daily.ts — up to 8 records, well under the 128KB message cap) per
# invocation. max_batch_size = 1 keeps that one-message-per-invocation
# guarantee exact, so each consumer invocation's D1 query count stays
# predictable (at most 8 × 5 = 40, comfortably under 50).
[[queues.producers]]
queue = "nvd-ingest"
binding = "NVD_QUEUE"

[[queues.consumers]]
queue = "nvd-ingest"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "nvd-ingest-dlq"

# MITRE CWE gap-fill queue. Replaces the old, removed full MITRE delta
# re-ingest (adapters/mitre.ts used to call MITRE's Secretariat/Bulk-
# Download-only LIST endpoint, which returns HTTP 400 for public callers —
# never actually working in production). pipelines/daily.ts's NVD section
# now only collects + chunks + enqueues the CVE IDs of NVD records it saw
# with zero CWEs (capped at MITRE_LOOKUP_MAX_PER_RUN = 1000/run);
# pipelines/mitreQueue.ts's consumer does the actual lookup (MITRE's PUBLIC
# single-record endpoint, one fetch per CVE ID, bounded concurrency) + D1
# write, one small message (≤20 CVE IDs) per invocation. max_batch_size = 1
# keeps that one-message-per-invocation guarantee exact, so each consumer
# invocation's D1 query count stays small and predictable (worst case: 20
# fetches + 1 read + 1 batched write ≈ 22 operations, comfortably under 50).
[[queues.producers]]
queue = "mitre-ingest"
binding = "MITRE_QUEUE"

[[queues.consumers]]
queue = "mitre-ingest"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "mitre-ingest-dlq"

# OSV (GHSA) queue. Carries both the lightweight daily OSV_DISCOVER kick-off
# (sent from pipelines/daily.ts's 01:00 UTC cron — all 5 Workers Free Cron
# Trigger slots are already used, so OSV can't get its own) and the
# OSV_FETCH work items that kick-off's consumer invocation (runOsvDiscovery)
# produces. Same reasoning as epss-ingest above: max_batch_size = 1 keeps
# every message — discovery or fetch — in its own invocation with a fresh
# 50-D1-query budget, so OSV's D1 work never shares (or competes for) the
# daily cron invocation's budget with NVD/MITRE/EPSS.
[[queues.producers]]
queue = "osv-ingest"
binding = "OSV_QUEUE"

[[queues.consumers]]
queue = "osv-ingest"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "osv-ingest-dlq"

# ── Staging environment ───────────────────────────────────────────────────────
# Wrangler does NOT inherit top-level bindings or triggers into
# [env.staging]; every binding and the cron list must be redeclared here.

[env.staging]
name = "threat-lens-ingest-staging"

# Explicitly EMPTY, not omitted — omitting this section still inherited the
# top-level crons at deploy time (confirmed 2026-10-28: a staging deploy
# with no [env.staging.triggers] block at all still failed with "reached the
# Workers Free limit of 5 cron triggers per account", proving the top-level
# [triggers] list was being applied to the staging Worker too). Cron Triggers
# are capped account-wide (5 on Workers Free — this account already hit that
# cap once, 2026-10-27), and production's threat-lens-ingest already uses
# all 5, so staging inheriting even one pushes the account over the limit.
# Staging exists to verify a build/deploy actually works, not to run its own
# autonomous ingestion schedule — invoke pipelines manually against it
# (wrangler dev / a manual fetch handler) if an end-to-end smoke test is
# ever needed.
[env.staging.triggers]
crons = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cve_staging_d1"
database_id = "4917885d-bcb3-4d4b-afdd-9dd2e425b86f"
migrations_dir = "../../migrations"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "cve-vector-index-staging"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cve_analytics_dataset_staging"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "62a704cae052492faa607582bf509f1a"

[[env.staging.queues.producers]]
queue = "cve-ingest-retry-staging"
binding = "RETRY_QUEUE"

[[env.staging.queues.consumers]]
queue = "cve-ingest-retry-staging"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "cve-ingest-dlq-staging"

# Isolated from production's epss-ingest queue for the same reason the
# staging section above is isolated from production's crons/cve-ingest-retry
# queue (see the explanatory comment at the top of this section): a distinct
# queue name + DLQ so staging traffic/retries never land in production's.
[[env.staging.queues.producers]]
queue = "epss-ingest-staging"
binding = "EPSS_QUEUE"

[[env.staging.queues.consumers]]
queue = "epss-ingest-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "epss-ingest-dlq-staging"

# Isolated from production's nvd-ingest queue for the same reason as
# epss-ingest-staging above.
[[env.staging.queues.producers]]
queue = "nvd-ingest-staging"
binding = "NVD_QUEUE"

[[env.staging.queues.consumers]]
queue = "nvd-ingest-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "nvd-ingest-dlq-staging"

# Isolated from production's mitre-ingest queue for the same reason as
# epss-ingest-staging above.
[[env.staging.queues.producers]]
queue = "mitre-ingest-staging"
binding = "MITRE_QUEUE"

[[env.staging.queues.consumers]]
queue = "mitre-ingest-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "mitre-ingest-dlq-staging"

# Isolated from production's osv-ingest queue for the same reason as
# epss-ingest-staging above.
[[env.staging.queues.producers]]
queue = "osv-ingest-staging"
binding = "OSV_QUEUE"

[[env.staging.queues.consumers]]
queue = "osv-ingest-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "osv-ingest-dlq-staging"
