name = "threat-lens-app"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

# Native Workers Logs — free, searchable in the dashboard. There was no
# working alerting/observability at all before this (the legacy stack's
# Alertmanager setup pointed at a dead receiver and doesn't apply here).
[observability]
enabled = true

# Static assets emitted by adapter-cloudflare. The SPA not-found handling
# routes deep-link cold loads (e.g. /cve/CVE-2026-12345 typed directly)
# to the worker entry instead of returning a static 404.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Production database. The app worker uses a read-mostly access pattern;
# write paths are gated by the application layer to admin-only routes.
# D1/KV resource IDs are not secrets (confirmed in the 2026-10-28 security
# review) — committed directly rather than left as REPLACE_AFTER_PROVISIONING
# placeholders, which had silently broken the staging deploy job in CI since
# nothing had ever filled them in.
[[d1_databases]]
binding = "DB"
database_name = "cve_prod_d1"
database_id = "277f037d-d7b2-405e-b639-6fef206f260c"
migrations_dir = "../../migrations"

# Vector index for hybrid semantic search.
[[vectorize]]
binding = "VECTORIZE"
index_name = "cve-vector-index"

# Telemetry sink for request-side metrics (search latencies, page views,
# rate-limit hits, audit log of IP + request_id).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cve_analytics_dataset"

# Workers AI binding for query-time embeddings on /api/search.
[ai]
binding = "AI"

# Hot-path response cache (metric snapshots, KEV list, CVE detail).
[[kv_namespaces]]
binding = "CACHE"
id = "6a5b96655a224e0cabccfd3611fa57fe"

# Per-IP search throttle (quota.ts) — Workers-native, free, no KV/D1 traffic.
# Approximate by design (fixed 60s window, not a sliding hour); the exact
# org-wide daily quota stays in D1. namespace_id just needs to be unique
# within this Worker, it isn't a provisioned resource.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 500, period = 60 }

# ── Staging environment ───────────────────────────────────────────────────────
# Wrangler does NOT inherit top-level bindings into [env.staging]; every
# binding must be re-declared here. This is intentional — see Section 1.4.3.

[env.staging]
name = "threat-lens-app-staging"

[env.staging.assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cve_staging_d1"
database_id = "4917885d-bcb3-4d4b-afdd-9dd2e425b86f"
migrations_dir = "../../migrations"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "cve-vector-index-staging"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cve_analytics_dataset_staging"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "62a704cae052492faa607582bf509f1a"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 500, period = 60 }
